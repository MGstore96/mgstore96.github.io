<!DOCTYPE html>
<html lang="id" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slopkit Relapse</title>
  <link rel="stylesheet" href="apache.css">
</head>
<body>
  <div class="container">
    <hr style="width: 100%;">
    <h2>Slopkit Relapse</h2>

    <div class="fw-status-card">
      <span class="status-dot status-online" id="statusDot"></span>
      <span>Firmware <b id="fwText">detecting</b></span>
      <span class="fw-badge supported" id="fwBadge">CACHING</span>
    </div>

    <div class="logo-container">
      <img src="logo.png" alt="logo mgstore" class="logo">
    </div>

    <div class="status-card">
      <div id="msgs">Menyiapkan Proses Caching... Mohon Tunggu</div>     
    </div>

    <div class="thanks-section">
      <h3>terima kasih kepada</h3>
      <div class="credit-list">
        <span class="credit-item">GamerHack93</span>
        <span class="credit-item">sleirsgoevy</span>
        <span class="credit-item">TheFlow</span>
        <span class="credit-item">Flatz</span>
        <span class="credit-item">Egycnq</span>
        <span class="credit-item">Jordy</span>
        <span class="credit-item">Sonic-Iso</span>
        <span class="credit-item">Abc</span>
        <span class="credit-item">Prb29327239</span>
        <span class="credit-item">Feyzee61</span>
        <span class="credit-item">AlAzif</span>
        <span class="credit-item">ChendoChap</span>
        <span class="credit-item">Kameleonre_</span>
        <span class="credit-item">SiSTR0</span>
      </div>
    </div>
  </div>

  <script>
    function setMsg(htmlContent, type) {
        var msgsElem = document.getElementById("msgs");
        if (!msgsElem) return;
        
        msgsElem.className = "";
        if (type === "success") {
            msgsElem.classList.add("success");
        } else if (type === "error") {
            msgsElem.classList.add("error");
        }
        msgsElem.innerHTML = htmlContent;
    }

    // Mendengarkan event ApplicationCache dari Browser PS4
    if (window.applicationCache) {
        var appCache = window.applicationCache;

        appCache.addEventListener('checking', function() {
            setMsg("Memeriksa File Cache...", "");
        }, false);

        appCache.addEventListener('downloading', function() {
            setMsg("Mulai Mengunduh File Offline...", "");
        }, false);

        appCache.addEventListener('progress', function(e) {
            if (e.total) {
                var percent = Math.round((e.loaded / e.total) * 100);
                setMsg("Menyimpan Cache Offline: <b style='color:#38bdf8;'>" + percent + "%</b>", "");
            } else {
                setMsg("Proses Menyimpan File Offline...", "");
            }
        }, false);

        appCache.addEventListener('cached', function() {
            setMsg("Cache Berhasil Disimpan!...", "success");
            setTimeout(function() {
                // Kembalikan ke file HTML utama kamu
                window.location.replace("index.html");
            }, 1000);
        }, false);

        appCache.addEventListener('noupdate', function() {
            setMsg("Cache Sudah Terbaru! Mengalihkan...", "success");
            setTimeout(function() {
                window.location.replace("index.html");
            }, 1000);
        }, false);

        appCache.addEventListener('error', function() {
            setMsg("Gagal Menyimpan Cache! Pastikan koneksi internet terhubung.", "error");
        }, false);

        appCache.addEventListener('obsolete', function() {
            setMsg("File Manifest tidak ditemukan (Obsolete).", "error");
        }, false);
    } else {
        setMsg("Browser ini tidak mendukung Application Cache.", "error");
    }
  </script>
</body>
</html>
